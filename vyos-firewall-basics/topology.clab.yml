name: vyos-firewall-basics

mgmt:
  network: clab-vyos
  ipv4-subnet: 172.20.24.0/24
  ipv6-subnet: 3fff:172:20:24::/64

topology:
  nodes:
    fw1:
      kind: linux
      image: ghcr.io/sever-sever/vyos-container@sha256:c79e39ef91ee15a884ebaaa624249bb6ec71eb2b1e27a49287ea3521aebe83c7
      binds:
        - configs/fw1.conf:/opt/vyatta/etc/config/config.boot:ro
      exec:
        - sleep 10  # Wait for VyOS to initialize

    client1:
      kind: linux
      image: alpine:3.22
      exec:
        - ip addr add 192.168.100.10/24 dev eth1
        - sh -c "ip route del default 2>/dev/null; ip route add default via 192.168.100.1"
        - apk add --no-cache curl

    internet:
      kind: linux
      image: alpine:3.22
      exec:
        - ip addr add 172.16.10.100/24 dev eth1
        - ip route add 192.168.100.0/24 via 172.16.10.1

  links:
    - endpoints: ["fw1:eth1", "internet:eth1"]   # WAN zone
    - endpoints: ["fw1:eth2", "client1:eth1"]    # LAN zone
