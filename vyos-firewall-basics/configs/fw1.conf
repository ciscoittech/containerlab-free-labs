firewall {
    ipv4 {
        name LAN-LOCAL {
            default-action "accept"
        }
        name LAN-WAN {
            default-action "accept"
            description "LAN to WAN - trusted egress"
        }
        name LOCAL-LAN {
            default-action "accept"
        }
        name LOCAL-WAN {
            default-action "accept"
        }
        name WAN-LAN {
            default-action "drop"
            description "WAN to LAN - default deny"
            rule 10 {
                action "accept"
                description "Stateful: allow established/related return traffic"
                state "established"
                state "related"
            }
            rule 20 {
                action "drop"
                description "Drop invalid"
                state "invalid"
            }
        }
        name WAN-LOCAL {
            default-action "drop"
            rule 10 {
                action "accept"
                state "established"
                state "related"
            }
        }
    }
    zone lan {
        description "LAN Zone (Trusted Internal)"
        from local {
            firewall {
                name "LOCAL-LAN"
            }
        }
        from wan {
            firewall {
                name "WAN-LAN"
            }
        }
        member {
            interface "eth2"
        }
    }
    zone local {
        description "The firewall itself"
        from lan {
            firewall {
                name "LAN-LOCAL"
            }
        }
        from wan {
            firewall {
                name "WAN-LOCAL"
            }
        }
        local-zone
    }
    zone wan {
        description "WAN Zone (Untrusted Internet)"
        from lan {
            firewall {
                name "LAN-WAN"
            }
        }
        from local {
            firewall {
                name "LOCAL-WAN"
            }
        }
        member {
            interface "eth1"
        }
    }
}
interfaces {
    ethernet eth1 {
        address "172.16.10.1/24"
        description "WAN Interface"
    }
    ethernet eth2 {
        address "192.168.100.1/24"
        description "LAN Interface"
    }
    loopback lo {
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    host-name "fw1"
    login {
        user vyos {
            authentication {
                encrypted-password "$6$QxPS.uk6mfo$9QBSo8u1FkH16gMyAVhus6fU3LOzvLR9Z9.82m3tiHFAxTtIkhaZSWssSgzt4v4dGAL8rhVQxTg0oAG9/q11h/"
                plaintext-password ""
            }
        }
    }
    name-server "8.8.8.8"
    time-zone "UTC"
}


