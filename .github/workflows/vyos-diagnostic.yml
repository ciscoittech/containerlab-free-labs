name: VyOS Diagnostic (temporary)

on:
  push:
    branches: [ fix/vyos-firewall ]
  workflow_dispatch:

jobs:
  candidates:
    name: "firewall commit: ${{ matrix.c.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        c:
          - label: "sever-sever rolling (current lab image)"
            image: "ghcr.io/sever-sever/vyos-container@sha256:c79e39ef91ee15a884ebaaa624249bb6ec71eb2b1e27a49287ea3521aebe83c7"
            syntax: "set firewall ipv4 name TEST default-action drop"
          - label: "vyos/vyos:1.3-epa2 (1.3 syntax)"
            image: "vyos/vyos:1.3-epa2"
            syntax: "set firewall name TEST default-action drop"
          - label: "vyos/vyos:1.2.8 (1.2 syntax)"
            image: "vyos/vyos:1.2.8"
            syntax: "set firewall name TEST default-action drop"
    steps:
      - name: Boot ${{ matrix.c.label }}
        run: |
          docker run -d --name vy --privileged --cap-add=ALL \
            "${{ matrix.c.image }}" /sbin/init
          for i in $(seq 1 30); do
            docker exec vy cat /opt/vyatta/etc/version >/dev/null 2>&1 && break
            sleep 5
          done
          echo "version: $(docker exec vy cat /opt/vyatta/etc/version 2>&1 | head -1)"

      - name: Attempt firewall commit
        run: |
          set -uo pipefail
          # No heredoc: an indented terminator inside a YAML block scalar does not
          # close it, which silently produced an empty script on the last two runs.
          printf '%s\n' \
            '#!/bin/vbash' \
            'source /opt/vyatta/etc/functions/script-template' \
            'configure' \
            '${{ matrix.c.syntax }}' \
            'commit' \
            'exit' > fw.sh
          echo "--- script to run ---"; cat fw.sh
          docker exec -i vy sh -c 'cat > /tmp/fw.sh; chmod +x /tmp/fw.sh' < fw.sh
          docker exec vy test -s /tmp/fw.sh || { echo "HARNESS ERROR: script empty/missing"; exit 2; }
          echo "--- as landed in container ---"; docker exec vy cat /tmp/fw.sh

          echo "--- executing ---"
          docker exec -t vy /tmp/fw.sh 2>&1 | tee out.txt || true

      - name: Adjudicate — is the rule actually in the running config?
        run: |
          # The only trustworthy signal. Grepping the commit output for "failed"
          # scored a silent no-op as success on an earlier run.
          docker exec -t vy vbash -c \
            'source /opt/vyatta/etc/functions/script-template; run show configuration commands' \
            > cfg.txt 2>&1 || true
          echo "--- firewall lines in running config ---"
          grep -i firewall cfg.txt || echo "(none)"
          if grep -qi "firewall.*TEST" cfg.txt; then
            echo "RESULT: COMMITTED — this image CAN hold a firewall config"
          else
            echo "RESULT: ABSENT — this image CANNOT hold a firewall config"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f vy || true
